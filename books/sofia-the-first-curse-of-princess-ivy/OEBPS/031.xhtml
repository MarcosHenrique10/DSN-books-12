    <p class="center no-indent">
      <span class="font-18">
        <span id="w976">&#8220;Amber!&#8221;</span>
      </span>
      <span class="font-11">
        <span id="w977">Sofia</span>
        <span id="w978">cries.</span>
      </span>
      <span class="font-18">
        <span id="w979">&#8220;Are</span>
        <span id="w980">you</span>
        <span id="w981">okay?&#8221;</span>
      </span>
    </p>
    <p class="center no-indent" style="margin-top:-10px">
      <span class="font-19">&#160;</span>
      <span class="font-11">
        <span id="w982">&#8220;You</span>
        <span id="w983">should</span>
        <span id="w984">worry</span>
        <span id="w985">about</span>
        <span id="w986">yourself,</span>
        <span id="w987">Sofia,&#8221;</span>
        <span id="w988">Ivy</span>
        <span id="w989">says,</span>
        <br/>
        <span id="w990">tossing</span>
        <span id="w991">another</span>
        <span id="w992"></span>
        <span id="w993">dragonfly</span>
        <span id="w994">at</span>
        <span id="w995">her.</span>
        <br/>
        <span id="w996">But</span>
        <span id="w997">it</span>
        <span id="w998">flickers</span>
        <span id="w999">and</span>
        <span id="w1000">disappears.</span>
      </span>
    </p>
    <p class="center no-indent">
      <span class="font-18">
        <span id="w1001">&#8220;What?&#8221;</span>
      </span>
      <span class="font-11">
        <span id="w1002">Ivy</span>
        <span id="w1003">exclaims.</span>
      </span>
      <span class="font-18">
        <span id="w1004">&#8220;Why</span>
        <span id="w1005">can&#8217;t</span>
        <span id="w1006">I . . .&#8221;</span>
      </span>
      </p>
      <p class="center no-indent">
      <span class="font-11">
        <span id="w1007">Her</span>
        <span id="w1008">voice</span>
        <span id="w1009">starts</span>
        <span id="w1010">to</span>
        <span id="w1011">fade<span class="m3">&#8212;</span></span>
        <span id="w1012">and</span>
        <span id="w1013">then</span>
        <span id="w1014">she</span>
        <span id="w1015">does,</span>
        <span id="w1016">too!</span>
      </span>
    </p>
