  <img src="images/033.jpg" alt="" />  <div class="text-frame" style="left:119px; top:145px; width:520px; height:132px;">    <p>      <span class="font-3">        <span id="w823">	&#8220;Lulu,&#8221;</span>        <span id="w824">says</span>        <span id="w825">Hildy.</span>        <span id="w826">&#8220;We&#8217;ll</span>        <span id="w827">do</span>        <span id="w828">this</span>        <span id="w829">together.</span>      </span>    </p>    <p class="no-indent">      <span class="font-3">        <span id="w830">You&#8217;ll</span>        <span id="w831">be</span>        <span id="w832">great!&#8221;</span>      </span>    </p>    <p>      <span class="font-3">        <span id="w833">	&#8220;Good</span>        <span id="w834">luck!&#8221;</span>        <span id="w835">Sofia</span>        <span id="w836">tells</span>        <span id="w837">Hildy.</span>      </span>    </p>    <p>      <span class="font-3">        <span id="w838">	Lulu</span>        <span id="w839">leaps</span>        <span id="w840">high</span>        <span id="w841">and</span>        <span id="w842">passes</span>        <span id="w843">through</span>        <span id="w844">a</span>        <span id="w845">hoop.</span>      </span>    </p>    <p class="no-indent">      <span class="font-3">        <span id="w846">The</span>        <span id="w847">audience</span>        <span id="w848">applauds</span>        <span id="w849">wildly.</span>      </span>    </p>  </div><span id="empty"></span></div>
