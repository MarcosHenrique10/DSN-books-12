    <p>
      <span class="font-3">
        <span id="w660">&#8220;It</span>
        <span id="w661">was</span>
        <span id="w662">in</span>
        <span id="w663">this</span>
        <span id="w664">spot,&#8221;</span>
        <span id="w665">says</span>
        <span id="w666">Hildy-</span><span id="w667">mouse.</span>
      </span>
    </p>
    <p style="margin-top: 0.5em;">
      <span id="w668">
        <span class="font-14"><span style="letter-spacing: 0.05em;">&#8220;</span>T</span><span id="w669" class="font-15">he</span>
      </span>
      <span id="w670">
      	<span class="font-14">M</span><span id="w671" class="font-15">agic</span>
      </span>
      <span id="w672">

      </span>
      <span class="font-3">
        <span id="w674">gasps</span>
        <span id="w675">Sofia.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-3">
        <span id="w676">&#8220;Hildy,</span>
        <span id="w677">you</span>
        <span id="w678">were</span>
        <span id="w679">standing</span>
        <span id="w680">right</span>
        <span id="w681">in</span>
        <span id="w682">front</span>
        <span id="w683">of</span>
        <span id="w684">it.&#8221;</span>
      </span>
    </p>
    <p>
      <span class="font-3">
        <span id="w685">	&#8220;That&#8217;s</span>
        <span id="w686">what</span>
        <span id="w687">turned</span>
        <span id="w688">me</span>
        <span id="w689">into</span>
        <span id="w690">a</span>
        <span id="w691">mouse?&#8221;</span>
        <span id="w692">asks</span>
        <span id="w693">Hildy.</span>
      </span>
    </p>
    <p>
      <span class="font-3">
        <span id="w694">&#8220;Make</span>
        <span id="w695">a</span>
        <span id="w696">wish</span>

        <span id="w698">we&#8217;ll</span>
        <span id="w699">find</span>
        <span id="w700">out,&#8221;</span>
        <span id="w701">says</span>
        <span id="w702">Sofia.</span>
      </span>
    </p>
    <p style="margin-top: 0.50em; margin-bottom: 0.25em;">
      <span class="font-3a">
        <span id="w703">&#8220;Magic</span>
        <span id="w704">Mirror,</span>
        <span id="w705">turn</span>
        <span id="w706">me</span>
        <span id="w707">back</span>
        <span id="w708">into</span>
        <span id="w709">a</span>
        <span id="w710">princess</span>
        <span id="w711">again!&#8221;</span>
      </span>
    </p>
