  <img src="images/012.jpg" alt="" />  <div class="text-frame" style="left:122px; top:621px; width:571px; height:103px;">    <p>      <span class="font-3">        <span id="w259">	Suddenly,</span>        <span id="w260">Princess</span>        <span id="w261">Hildegard</span>        <span id="w262">turns</span>        <span id="w263">into</span>        <span id="w264">a</span>        <span id="w265">mouse!</span>      </span>    </p>    <p>      <span class="font-3">        <span id="w266">	&#8220;Oh,</span>        <span id="w267">no!&#8221;</span>        <span id="w268">Hildegard</span>        <span id="w269">squeaks</span>        <span id="w270">when</span>        <span id="w271">she</span>        <span id="w272">sees</span>        <span id="w273">her</span>        <br/>        <span id="w274">reflection.</span>        <span id="w275">&#8220;This</span>        <span id="w276">can&#8217;t</span>        <span id="w277">be!</span>        <span id="w278">I&#8217;m</span>        <span id="w279">so</span>        <span id="w280">small</span>        <span id="w281">and</span>        <span id="w282">everything</span>        <br/>        <span id="w283">is</span>        <span id="w284">so</span>        <span id="w285">big!</span>        <span id="w286">Help!&#8221;</span>        <span id="w287">she</span>        <span id="w288">screams</span>        <span id="w289">in</span>        <span id="w290">a</span>        <span id="w291">tiny</span>        <span id="w292">voice.</span>      </span>    </p>  </div><span id="empty"></span></div>
