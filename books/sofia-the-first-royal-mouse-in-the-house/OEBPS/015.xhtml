    <p>
      <span class="font-3">
        <span id="w314">	Clover</span>
        <span id="w315">asks</span>
        <span id="w316">the</span>
        <span id="w317">mouse</span>

    </p>
    <p>
      <span class="font-3">
        <span id="w320">&#8220;Clover,</span>

        <span id="w322">me,</span>
        <span id="w323">Princess</span>
        <span id="w324">Hildegard,&#8221;</span>

    </p>
    <p class="no-indent">
      <span class="font-3">

        <span id="w327">says.</span>
      </span>
    </p>
    <p>
      <span class="font-3">
        <span id="w328">	Clover</span>

        <span id="w330">believe</span>
        <span id="w331">it.</span>
        <span id="w332">&#8220;What</span>
        <span id="w333">happened?&#8221;</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-3">
        <span id="w334">he</span>
        <span id="w335">asks.</span>
      </span>
    </p>
    <p>
      <span class="font-3">
        <span id="w336">	&#8220;I</span>
        <span id="w337">don&#8217;t</span>
        <span id="w338">know,&#8221;</span>
        <span id="w339">Hildy</span>
        <span id="w340">answers.</span>
        <span id="w341">&#8220;What</span>
        <br/>
        <span id="w342">should</span>
        <span id="w343">I</span>
        <span id="w344">do?&#8221;</span>
      </span>
    </p>
    <p>
      <span class="font-3">
        <span id="w345">	&#8220;Sofia</span>
        <span id="w346">will</span>
        <span id="w347">know,&#8221;</span>
        <span id="w348">says</span>
        <span id="w349">Clover.</span>
        <span id="w350">&#8220;Hop</span>
        <span id="w351">on!&#8221;</span>
